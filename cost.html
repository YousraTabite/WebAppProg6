<!DOCTYPE html>
<html>

<head>
    <title>Sales Computation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-4">

<h2>Yousra sales computation</h2>

<form>
    <label for="numberItems">Enter number items</label>
    <input type="number" class="form-control" id="numberItems" value="1"> <br>

    <label for="itemCost">Enter the cost of one item</label>
    <input type="number" class="form-control" id="itemCost" value="20.0"> <br>

    <label for="numberForDiscount">Enter number to get discount</label>
    <input type="number" class="form-control" id="numberForDiscount" value="10"> <br>

    <label for="discountRate">Enter the discount rate</label>
    <input type="number" class="form-control" id="discountRate" value="0.15"> <br>

    <input type="button"  class="btn btn-primary" onclick="doDiscount()" value="Show costs">
</form>

<p id="result" class="alert alert-info mt-3">Costs will be displayed here</p>
<form>
    <input type="radio" id="product" name="operation" value="mul" onclick="chooseOp()">
    <label for="product">product</label>

    <input type="radio" id="sum" name="operation" value="add" onclick="chooseOp()">
    <label for="sum">sum</label>

    <input type="radio" id="divide" name="operation" value="div" onclick="chooseOp()">
    <label for="divide">divide</label>
</form>

<p id="operationResult" class="alert alert-secondary mt-3">Operation result will be displayed here</p>

<script>

function doDiscount() {
    number = Number(document.getElementById("numberItems").value)
    cost = Number(document.getElementById("itemCost").value)
    discountRate = Number(document.getElementById("discountRate").value)
    discountAt = Number(document.getElementById("numberForDiscount").value)

    costs = ""

    for (i = 1; i <= 5; i++) {
        checkCount = i * number

        if (checkCount <= discountAt) {
            totalCost = checkCount * cost
        } else {
            totalCost = (discountAt * cost) +
                ((checkCount - discountAt) * cost * (1 - discountRate))
        }

        costs = costs + "checkCount " + checkCount + " is " + totalCost + "; "
    }

    document.getElementById("result").innerHTML = "Costs are: " + costs
}
function chooseOp() {
    count = Number(document.getElementById("numberItems").value)
    discountAt = Number(document.getElementById("numberForDiscount").value)

    if (document.getElementById("product").checked) {
        value = count * discountAt
        text = count + " times " + discountAt + " is " + value
    } else if (document.getElementById("sum").checked) {
        value = count + discountAt
        text = count + " plus " + discountAt + " is " + value
    } else if (document.getElementById("divide").checked) {
        value = count / discountAt
        text = count + " divided by " + discountAt + " is " + value
    }

    document.getElementById("operationResult").innerHTML = text
}

</script>
</div>


</body>
</html>
