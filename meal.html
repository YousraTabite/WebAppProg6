<!DOCTYPE html>
<html>

<head>
    <title>Meal Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
 
<body>
    <div class="container mt-4"> 

<h2>Yousra meal planner</h2>

<form>
    <input type="checkbox" id="breakfast" value="True">
    <label for="breakfast">Breakfast</label>

    <input type="checkbox" id="lunch" value="False">
    <label for="lunch">Lunch</label>

    <input type="checkbox" id="dinner" value="True">
    <label for="dinner">Dinner</label>

    <br>
<input type="button"  class="btn btn-primary" onclick="choices()" value="Meal Plan Choices">
    

</form>

<form>
    <label for="cuisine">Enter cuisine type</label>
    <input type="text"  class="form-control" id="cuisine" value="Italian"> <br>

    <label for="beverage">Enter beverage choice</label>
    <input type="text"  class="form-control" id="beverage" value="water"> <br>
    <br>
    <input type="button"  class="btn btn-success" onclick="updateMeal()" value="Update the meal plan">
</form>


<p id="result" class="alert alert-info mt-3">Meal plan will be displayed here</p>

<script>

let my_meal_plan = {}

function choices() {
    my_meal_plan = {}

    my_meal_plan.breakfast = document.getElementById("breakfast").checked
    my_meal_plan.lunch = document.getElementById("lunch").checked
    my_meal_plan.dinner = document.getElementById("dinner").checked

    document.getElementById("result").innerHTML = JSON.stringify(my_meal_plan)
}
function updateMeal() {
    cuisine = document.getElementById("cuisine").value
    beverage = document.getElementById("beverage").value

    my_meal_plan["cuisine"] = cuisine
    my_meal_plan["beverage"] = beverage

    document.getElementById("result").innerHTML = JSON.stringify(my_meal_plan)
    
}
</script>

</div>
</body>
</html>
