<!DOCTYPE html>
<html>
    <head>
        <title>Actors Game</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
 
 
<body>
    <div class="container mt-4">

<h2>Actors by Yousra</h2>

<form>
    <label for="actor">Peter Pan</label>
    <input type="password" id="actor" value="Robin Williams" class="form-control">

    <label for="guess">Who is the actor</label>
    <input type="text" id="guess" class="form-control">

    <input type="button" id="guessButton" class="btn btn-primary mt-2" onclick="checkActor()" value="Check the guess">
</form>

<div id="result" class="alert alert-info mt-3">Correct: 0 Not Correct: 0</div>

<div>
    <img id="foodPic" src="burger.jfif" width="150" height="150" class="rounded shadow mt-2" onclick="updatePic()">
</div>

<script>

let correct = 0
let notCorrect = 0
let usePic = 1

function checkActor() {
    actor = document.getElementById("actor").value
    guess = document.getElementById("guess").value

    if (actor == guess) {
        correct = correct + 1
        alert("That's right")
    } else {
        notCorrect = notCorrect + 1
        alert("Better luck next time")

        if (notCorrect > 10) {
            document.getElementById("guessButton").setAttribute("onclick", "tooManyWrong()")
        }
    }

    out = document.getElementById("result")
    out.innerHTML = "Correct: " + correct + " Not Correct: " + notCorrect
}

function tooManyWrong() {
    alert("Sorry, too many wrong guesses.")
}

function updatePic() {
    switch (usePic) {
        case 1:
            document.getElementById("foodPic").src = "ice cream.jfif"
            usePic = 2
            break

        case 2:
            document.getElementById("foodPic").src = "tacos.jfif"
            usePic = 3
            break

        case 3:
            document.getElementById("foodPic").src = "burger.jfif"
            usePic = 1
            break
    }
}


</script>

    </div>
</body>
</html>
